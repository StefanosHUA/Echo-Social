server:
  port: 8000

spring:
  application:
    name: api-gateway

  # 1. Redis Configuration for the Rate Limiter
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      # 2. Apply the Rate Limiter globally to all incoming requests
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userIpKeyResolver}"

      # (If you define your microservice routes in YAML rather than Java, keep them down here under 'routes:')
      # routes:
      #  ...

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.cors: DEBUG